name: PyTorch compatibility

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        pytorch-version: ["2.13.0", "2.14.0"]
    name: Python ${{ matrix.python-version }} / PyTorch ${{ matrix.pytorch-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install the selected PyTorch release
        run: |
          python -m pip install --upgrade --progress-bar off pip
          python -m pip install \
            "torch==${{ matrix.pytorch-version }}" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install TorchDR and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Verify the PyTorch version
        run: |
          python -c "import torch; assert torch.__version__.split('+')[0] == '${{ matrix.pytorch-version }}', torch.__version__"

      - name: Run tests
        run: python -m pytest torchdr/ --verbose
