name: Distributed integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/distributed-integration.yml"
      - "torchdr/affinity_matcher.py"
      - "torchdr/affinity/base.py"
      - "torchdr/distance/base.py"
      - "torchdr/distance/faiss.py"
      - "torchdr/distance/faiss_plan.py"
      - "torchdr/distributed/**"
      - "torchdr/neighbor_embedding/**"
      - "torchdr/spectral_embedding/pca.py"
      - "torchdr/tests/test_distributed_faiss_training.py"
      - "torchdr/tests/test_distributed_faiss_shard.py"
      - "torchdr/tests/test_distributed_faiss_shard_failure.py"
      - "torchdr/tests/test_distributed_integration.py"
      - "torchdr/tests/test_distributed_neighbor_embedding.py"
      - "torchdr/tests/test_distributed_sparse.py"
      - "torchdr/utils/sparse.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/distributed-integration.yml"
      - "torchdr/affinity_matcher.py"
      - "torchdr/affinity/base.py"
      - "torchdr/distance/base.py"
      - "torchdr/distance/faiss.py"
      - "torchdr/distance/faiss_plan.py"
      - "torchdr/distributed/**"
      - "torchdr/neighbor_embedding/**"
      - "torchdr/spectral_embedding/pca.py"
      - "torchdr/tests/test_distributed_faiss_training.py"
      - "torchdr/tests/test_distributed_faiss_shard.py"
      - "torchdr/tests/test_distributed_faiss_shard_failure.py"
      - "torchdr/tests/test_distributed_integration.py"
      - "torchdr/tests/test_distributed_neighbor_embedding.py"
      - "torchdr/tests/test_distributed_sparse.py"
      - "torchdr/utils/sparse.py"

jobs:
  test-distributed-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install TorchDR
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run two-process integration test
        env:
          TORCHDR_DISTRIBUTED_TEST: "1"
        run: >-
          python -m torch.distributed.run --standalone --nnodes=1
          --nproc-per-node=2 -m pytest
          torchdr/tests/test_distributed_integration.py -q
      - name: Run two-process sparse symmetrization test
        env:
          TORCHDR_DISTRIBUTED_TEST: "1"
        run: >-
          python -m torch.distributed.run --standalone --nnodes=1
          --nproc-per-node=2 -m pytest
          torchdr/tests/test_distributed_sparse.py -q
      - name: Run two-process neighbor-embedding training-step test
        env:
          TORCHDR_DISTRIBUTED_TEST: "1"
        run: >-
          python -m torch.distributed.run --standalone --nnodes=1
          --nproc-per-node=2 -m pytest
          torchdr/tests/test_distributed_neighbor_embedding.py -q

  test-distributed-faiss-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: test-distributed-faiss-env
      - name: Install FAISS
        run: conda install -c pytorch -c conda-forge faiss-cpu=1.11.0 "numpy<2" --yes
      - name: Install TorchDR
        run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Verify FAISS installation
        run: python -c "from torchdr.utils.faiss import faiss; assert faiss"
      - name: Run two-process index training test
        env:
          TORCHDR_DISTRIBUTED_TEST: "1"
        run: >-
          python -m torch.distributed.run --standalone --nnodes=1
          --nproc-per-node=2 -m pytest
          torchdr/tests/test_distributed_faiss_training.py -q
      - name: Run two-process sharded search test
        env:
          TORCHDR_DISTRIBUTED_TEST: "1"
        run: >-
          python -m torch.distributed.run --standalone --nnodes=1
          --nproc-per-node=2 -m pytest
          torchdr/tests/test_distributed_faiss_shard.py -q
      - name: Run four-process sharded search test
        env:
          TORCHDR_DISTRIBUTED_TEST: "1"
        run: >-
          python -m torch.distributed.run --standalone --nnodes=1
          --nproc-per-node=4 -m pytest
          torchdr/tests/test_distributed_faiss_shard.py -q
      - name: Run two-process sharded failure-propagation test
        env:
          TORCHDR_DISTRIBUTED_TEST: "1"
        run: >-
          python -m torch.distributed.run --standalone --nnodes=1
          --nproc-per-node=2 -m pytest
          torchdr/tests/test_distributed_faiss_shard_failure.py -q
      - name: Run four-process sharded failure-propagation test
        env:
          TORCHDR_DISTRIBUTED_TEST: "1"
        run: >-
          python -m torch.distributed.run --standalone --nnodes=1
          --nproc-per-node=4 -m pytest
          torchdr/tests/test_distributed_faiss_shard_failure.py -q
