name: Testing
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "**"

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Install torchdr
      - name: Checking Out Repository
        uses: actions/checkout@v4
      # Cache 'torchdr' datasets
      - name: Create/Restore torchdr Data Cache
        id: cache-torchdr_datasets
        uses: actions/cache@v4
        with:
          path: ~/torchdr_datasets
          key: ${{ runner.os }}-v3
      # Install Python & Packages
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: which python
      - name: Install dependencies
        run: |
          python -m pip install --user --upgrade --progress-bar off pip
      - name: Install 'torchdr' package
        run: |
          python -m pip install --user -e .[all,test]
      # Run Tests
      - name: Run Tests
        run: pytest torchdr/ --verbose --cov=torchdr --cov-report term --cov-report xml
      - name: Build and smoke test wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          if unzip -l dist/torchdr-*.whl | grep -q "torchdr/tests/"; then
            echo "Wheel unexpectedly contains the test suite."
            exit 1
          fi
          python -m pip uninstall --yes torchdr
          python -m pip install --user --no-deps dist/torchdr-*.whl
          cd "${RUNNER_TEMP}"
          python -c "import torchdr, torchdr.affinity, torchdr.distance, torchdr.distributed, torchdr.eval, torchdr.neighbor_embedding, torchdr.spectral_embedding, torchdr.utils"
      # Codecov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TorchDR/TorchDR
          flags: unittests
          files: coverage.xml

  Test-minimal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Install torchdr
      - name: Checking Out Repository
        uses: actions/checkout@v4
      # Cache 'torchdr' datasets
      - name: Create/Restore torchdr Data Cache
        id: cache-torchdr_datasets
        uses: actions/cache@v4
        with:
          path: ~/torchdr_datasets
          key: ${{ runner.os }}-v3
      # Install Python & Packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: which python
      - name: Install dependencies
        run: |
          python -m pip install --user --upgrade --progress-bar off pip
      - name: Install 'torchdr' package
        run: |
          python -m pip install --user -e .[test]
      # Run Tests
      - name: Run Tests
        run: pytest torchdr/ --verbose --cov=torchdr --cov-report term --cov-report xml
      # Codecov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TorchDR/TorchDR
          flags: unittests
          files: coverage.xml

  Test-minimal-crossplatform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Install torchdr
      - name: Checking Out Repository
        uses: actions/checkout@v4
      # Cache 'torchdr' datasets
      - name: Create/Restore torchdr Data Cache
        id: cache-torchdr_datasets
        uses: actions/cache@v4
        with:
          path: ~/torchdr_datasets
          key: ${{ runner.os }}-v3
      # Install Python & Packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: 'pip'
      - run: which python
      - name: Install dependencies
        run: |
          python -m pip install --user --upgrade --progress-bar off pip
      - name: Install 'torchdr' package
        run: |
          python -m pip install --user -e .[test]
      # Run Tests
      - name: Run Tests
        run: python -m pytest torchdr/ --verbose --cov=torchdr --cov-report term --cov-report xml
      # Codecov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TorchDR/TorchDR
          flags: unittests
          files: coverage.xml

  Test-faiss:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checking Out Repository
        uses: actions/checkout@v4
      - name: Create/Restore torchdr Data Cache
        id: cache-torchdr_datasets_faiss
        uses: actions/cache@v4
        with:
          path: ~/torchdr_datasets
          key: ${{ runner.os }}-v3-faiss
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: test-faiss-env
      - run: which python
      - name: Upgrade pip
        run: pip install --upgrade pip
      - name: Install FAISS
        run: conda install -c pytorch -c conda-forge faiss-cpu=1.11.0 "numpy<2" --yes
      - name: Install 'torchdr' package
        run: pip install -e ".[test]"
      - name: Verify FAISS installation
        run: python -c "from torchdr.utils.faiss import faiss; assert faiss, 'FAISS failed to import'"
      - name: Run Tests
        run: pytest torchdr/tests/test_utils.py torchdr/tests/test_dataloader.py torchdr/tests/test_eval.py torchdr/tests/test_faiss_index_training.py --verbose --cov=torchdr --cov-report term --cov-report xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TorchDR/TorchDR
          flags: faiss
          files: coverage.xml
